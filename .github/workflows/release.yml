name: release
on:
  push:
    tags: ['v*.*.*-*']   # наши router-сборки vX.Y.Z-N (upstream vX.Y.Z не триггерит)
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Тесты идут ДО сборки: провалившийся страж обязан остановить релиз, а не
      # быть замеченным после выкладки артефактов. Сторожат они связки обвязки
      # с апстримовым кодом — те ломаются молча, а не отказом сборки.
      - name: Test
        run: go test -race ./...

      - name: Build router binaries
        run: |
          set -e
          VER="${GITHUB_REF_NAME#v}"
          # -trimpath + фиксированные ldflags — сборка воспроизводима, SHA256
          # релиза совпадает с локальной проверкой перед заливкой на зеркало.
          LDFLAGS="-X main.version=${VER} -s -w"
          mkdir -p dist
          build() { # $1 goarch  $2 suffix  $3 extra-env
            for pkg in ./cmd/client ./cmd/server; do
              name=$(basename "$pkg")
              env GOOS=linux GOARCH="$1" CGO_ENABLED=0 $3 \
                go build -ldflags "$LDFLAGS" -trimpath -o "dist/ft-${name}-linux-$2" "$pkg"
            done
          }
          build arm64 arm64 ""
          build mipsle mipsle-softfloat "GOMIPS=softfloat"
          build mips mips-softfloat "GOMIPS=softfloat"
          (cd dist && sha256sum * > checksums.txt)
      - name: Release
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes "router auto-captcha build, см. AWG-PATCHES.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
